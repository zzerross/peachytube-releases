# Builds PeachyTube from its private source (the steps: tools/ci/public-build.sh there).
name: Build from source
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false
concurrency: build
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zzerross/peachytube
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
      - run: bash src/tools/ci/public-build.sh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          PUB: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
