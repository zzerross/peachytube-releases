<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PeachyTube</title>
<link rel="icon" href="icon.png?v=wave">
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --bg: #fff8f3; --fg: #2b2622; --muted: #6f655d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121317; --fg: #eceaf0; --muted: #9c9aa8; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 56px 20px; text-align: center; }
  h1 { font-size: 26px; margin: 12px 0 4px; }
  p { color: var(--muted); margin: 8px 0; }
</style>
</head>
<body>
<main>
  <img src="icon.png?v=wave" alt="" width="104" height="104">
  <h1>PeachyTube</h1>
  <p>PeachyTube is in a private beta for now: downloads are closed.</p>
  <p>Thanks to everyone who tried it.</p>
</main>
</body>
</html>
